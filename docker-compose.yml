services:
  selenium:
    profiles: ["browser"]
    image: ${SELENIUM_IMAGE:-selenium/standalone-chrome:4.45.0}
    container_name: selenium
    shm_size: "2g"
    ports:
      # noVNC 默认只允许本机访问；远程主机可通过 NOVNC_BIND_ADDRESS 绑定私网 IP。
      - "${NOVNC_BIND_ADDRESS:-127.0.0.1}:7900:7900"
      # WebDriver 4444 不发布到宿主机，discord-to-wechat 通过 Docker 内网连接。
      # - "5900:5900"  # 如需原生 VNC 客户端
    environment:
      # WebDriver 会话失联后尽快释放 slot，避免 Selenium 卡住一天导致监听无法重连。
      - SE_NODE_SESSION_TIMEOUT=600
      - SE_SESSION_REQUEST_TIMEOUT=60
      - SE_SESSION_RETRY_INTERVAL=2
      # - SE_VNC_PASSWORD=mynewpassword  # 自定义 VNC 密码
    volumes:
      - ./selenium_data:/home/seluser/discord-chrome-data  # 使用命名卷持久化 WebDriver 的用户数据目录
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:4444/status', timeout=3)); nodes=data.get('value',{}).get('nodes',[]); assert any(n.get('availability') == 'UP' for n in nodes)"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
  webhook-server:
    build: ./webhook_server
    image: discord-webhook-server:latest
    container_name: webhook-server
    environment:
      - TZ=Asia/Shanghai
      - WEBHOOK_TIMEZONE=Asia/Shanghai
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
      - WEBHOOK_DATA_DIR=/data
      # 可选：设置后写入和查询都需要 Authorization: Bearer <token>
      # - WEBHOOK_TOKEN=change-me
      # 可选：收到消息后由 webhook-server 统一转发到飞书/企业微信
      # - FORWARD_WORKERS=2
      # - >-
      #   FORWARD_ROUTES_JSON=[
      #     {
      #       "channels":["https://discord.com/channels/服务器ID/频道ID"],
      #       "targets":[
      #         {"type":"feishu","name":"飞书群","webhook":"https://open.feishu.cn/open-apis/bot/v2/hook/xxxxx","secret":""},
      #         {"type":"enterprise_wechat","name":"企业微信群","webhook":"https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxx"}
      #       ]
      #     }
      #   ]
    volumes:
      - ./webhook_server/data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  discord-to-wechat:
    image: discord-to-wechat:latest
    build: .
    container_name: discord-to-wechat
    environment:
      # 可选：覆盖 config.py 中的参数（如需）
      - TZ=Asia/Shanghai
      # 在 docker compose 默认网络里，使用服务名访问 selenium
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
      # gateway_user 模式使用；建议仅在 .env 中设置，不要写入 config.py 或提交 Git。
      - DISCORD_USER_TOKEN=${DISCORD_USER_TOKEN:-}
      # 可选：为“程序自身的 HTTP 请求/下载”等设置代理（不影响 Chrome，Chrome 走下面的 CHROME_PROXY）
      # - HTTP_PROXY=http://127.0.0.1:7890
      # - HTTPS_PROXY=http://127.0.0.1:7890
      # 关键：避免 WebDriver 连接 selenium 也走代理
      # - NO_PROXY=selenium,localhost,127.0.0.1
      # 可选：显式设置 Chrome 代理（推荐用这个，确保 Selenium 里打开外网也走代理）
      # - CHROME_PROXY=http://127.0.0.1:7890
    volumes:
      - ./config.py:/app/config.py:ro
    depends_on:
      webhook-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  selenium_data:
    driver: local
