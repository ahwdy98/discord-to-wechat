services:
  webhook-server:
    build: ./webhook_server
    image: discord-webhook-server:latest
    container_name: webhook-server
    environment:
      - TZ=Asia/Shanghai
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
      - WEBHOOK_DATA_DIR=/data
      # - WEBHOOK_TOKEN=change-me
      # - FORWARD_WORKERS=2
      # - FORWARD_ROUTES_JSON=[]
    volumes:
      - ./webhook_server/data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
